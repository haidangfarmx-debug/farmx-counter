<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FarmX — Đo thử hình học</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;
  font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

.man{position:fixed;inset:0;background:#000;display:none}
.man.hien{display:block}

/* ---------- man chup: khong chu, khong o nhap, khong dong trang thai ---------- */
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
#nut-chup{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(28px + env(safe-area-inset-bottom));
  width:74px;height:74px;border-radius:50%;background:#fff;
  border:5px solid rgba(255,255,255,.45);background-clip:padding-box;
  cursor:pointer;z-index:3;padding:0}
#nut-chup:active{transform:translateX(-50%) scale(.93)}
#nut-chup:disabled{opacity:.45}

/* Chi hien khi camera hong — khong de man den im lang */
#loi-cam{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:4;
  background:rgba(168,32,25,.94);padding:16px;border-radius:14px;font-size:16px;line-height:1.45;display:none}

/* ---------- man ket qua ---------- */
#khungAnh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas#anh{display:block;touch-action:none}
canvas#lup{position:absolute;display:none;width:132px;height:132px;border-radius:50%;
  border:3px solid #fff;box-shadow:0 3px 14px rgba(0,0,0,.55);pointer-events:none;z-index:5;background:#000}

/* Dong nho: CHI hien khi duoi 6 ma, hoac khi khong nan duoc */
#ghi{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;
  background:rgba(150,98,20,.92);padding:8px 12px;border-radius:11px;
  font-size:14px;line-height:1.4;text-align:center;display:none}
#ghi.nang{background:rgba(168,32,25,.94)}

.tron{position:absolute;z-index:6;width:48px;height:48px;border-radius:50%;border:0;
  background:rgba(255,255,255,.16);color:#fff;font-size:21px;line-height:1;cursor:pointer;padding:0}
.tron:active{background:rgba(255,255,255,.3)}
#lai{right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}
#xoa{right:14px;bottom:calc(72px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<!-- ================= MAN CHUP ================= -->
<div class="man hien" id="man-chup">
  <video id="video" playsinline muted></video>
  <button id="nut-chup" aria-label="Chụp"></button>
  <div id="loi-cam"></div>
</div>

<!-- ================= MAN KET QUA ================= -->
<div class="man" id="man-kq">
  <div id="khungAnh">
    <canvas id="anh"></canvas>
    <canvas id="lup" width="132" height="132"></canvas>
  </div>
  <div id="ghi"></div>
  <button class="tron" id="xoa" aria-label="Xoá các đoạn đã đo">✕</button>
  <button class="tron" id="lai" aria-label="Chụp lại">↺</button>
</div>

<script src="lib/cv.js"></script>
<script src="lib/aruco.js"></script>
<script src="lib/aruco_4x4_1000.js"></script>
<script type="module">
import { timMa, matPhang, warp, thuNho, MA_DV } from "./app.js";

const $ = s => document.querySelector(s);
const MAU = ["#4FA3F7","#FF6B6B","#3ECFA8","#FFC857","#C08CF0","#7BD86A","#FF8FC7","#8AA0FF","#FFAE63","#5AD6E0"];
const CANH_DICH = 2000;   // muc nham cho canh dai anh nan
const CO_MA_MM  = 25;     // canh ma in ra, CO DINH, khong hoi nguoi dung
const SO_MA_DU  = 6;

let goc = null, heSoNho = 1, mp = null, nan = null, pxDv = 1;
let diem = [], doan = [];
let zoom = { s:1, tx:0, ty:0 };
let stream = null;

// 1 don vi ma = CO_MA_MM/MA_DV mm, moi don vi rong pxDv px trong anh nan.
const mmMoiPx = () => CO_MA_MM / (MA_DV * pxDv);
const hienMan = id => document.querySelectorAll(".man").forEach(m => m.classList.toggle("hien", m.id === id));

// ================= MAN CHUP =================
$("#nut-chup").onclick = () => stream ? chup() : batCam();

async function batCam(){
  $("#loi-cam").style.display = "none";
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ ideal:"environment" }, width:{ ideal:3024 }, height:{ ideal:4032 } },
      audio: false
    });
    const v = $("#video");
    v.srcObject = stream;
    await v.play();
  }catch(e){
    stream = null;
    $("#loi-cam").textContent = "Không mở được camera: " + ((e && e.message) || e) + " — chạm nút tròn để thử lại.";
    $("#loi-cam").style.display = "block";
  }
}

function dungCam(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

// Bam nut: chup khung hien tai, do ma, nan, sang THANG man ket qua.
// KHONG chan, khong bat chup lai, du thay it ma.
function chup(){
  const v = $("#video");
  if(!v.videoWidth) return;
  const nut = $("#nut-chup");
  nut.disabled = true;

  const khung = document.createElement("canvas");
  khung.width = v.videoWidth; khung.height = v.videoHeight;
  khung.getContext("2d").drawImage(v, 0, 0);
  dungCam();

  let tam = null, m = null, s = 1;
  try{
    let nhoTmp;
    ({ canvas:nhoTmp, s } = thuNho(khung));
    tam = timMa(nhoTmp);
    if(tam && tam.size >= 3) m = matPhang(tam);
  }catch(e){ /* coi nhu khong do duoc */ }

  goc = khung; heSoNho = s; mp = m;
  doan = []; diem = []; nan = null;
  const soThay = tam ? tam.size : 0;
  hienMan("man-kq");
  nut.disabled = false;

  if(!m){
    // Duoi 3 ma thi khong co homography — khong the nan. Van sang man ket qua va noi ro vi sao.
    const c = $("#anh"); c.width = 1; c.height = 1; c.style.width = "0px"; c.style.height = "0px";
    ghiChu(`Thấy ${soThay}/${SO_MA_DU} mã — cần ít nhất 3 mã mới dựng được mặt phẳng khay, chưa nắn được ảnh.`, true);
    return;
  }

  const V = mp.vung;
  pxDv = Math.max(0.5, Math.min(24, +(CANH_DICH / Math.max(V.w, V.h)).toFixed(2)));
  nanLai();
  // Du 6 ma thi khong hien gi ca; thieu ma moi bao.
  ghiChu(mp.soMa < SO_MA_DU
    ? `Thấy ${mp.soMa}/${SO_MA_DU} mã · sai số tái chiếu ${mp.saiSo.rms} px — vùng đo co lại, số đo giữa các lần chụp không so sánh được.`
    : "", false);
}

function ghiChu(txt, nang){
  const e = $("#ghi");
  e.textContent = txt;
  e.className = nang ? "nang" : "";
  e.style.display = txt ? "block" : "none";
}

$("#lai").onclick = () => { ghiChu("", false); anLup(); hienMan("man-chup"); batCam(); };
$("#xoa").onclick = () => { doan = []; diem = []; anLup(); ve(); };

// ================= NAN =================
// mp.H dua toa do anh nan -> he anh DA THU NHO. Nhan hai hang dau voi 1/s de doi sang he
// anh GOC roi lay mau thang tu khung goc -> net that, khong phai phong to noi suy.
function hTheoGoc(){
  const k = 1 / (heSoNho || 1), H = mp.H;
  return [ H[0]*k, H[1]*k, H[2]*k, H[3]*k, H[4]*k, H[5]*k, H[6], H[7], H[8] ];
}

function nanLai(){
  if(!goc || !mp) return;
  const V = mp.vung;
  const w = Math.round(V.w * pxDv), h = Math.round(V.h * pxDv);
  if(!(w > 0 && h > 0) || w*h > 40e6){ ghiChu(`Không nắn được (ảnh sẽ là ${w}×${h} px).`, true); return; }
  nan = warp(goc, hTheoGoc(), w, h, Math.round(V.x * pxDv), Math.round(V.y * pxDv));
  const c = $("#anh");
  c.width = nan.width; c.height = nan.height;
  zoom = { s:1, tx:0, ty:0 };
  vuaKhung();
  ve();
}

// Anh nan vua het man hinh, giu dung ti le.
function vuaKhung(){
  if(!nan) return;
  const c = $("#anh"), o = $("#khungAnh").getBoundingClientRect();
  const W = o.width  || window.innerWidth;
  const H = o.height || window.innerHeight;
  const k = Math.min(W / nan.width, H / nan.height);
  c.style.width  = Math.round(nan.width  * k) + "px";
  c.style.height = Math.round(nan.height * k) + "px";
}

// ================= VE =================
function tyLeManHinh(){
  const c = $("#anh"), r = c.getBoundingClientRect();
  return (r.width ? r.width / c.width : 1) * zoom.s;
}

function ve(){
  if(!nan) return;
  const c = $("#anh"), g = c.getContext("2d");
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle = "#000"; g.fillRect(0,0,c.width,c.height);
  g.setTransform(zoom.s,0,0,zoom.s,zoom.tx,zoom.ty);
  g.drawImage(nan,0,0);

  const tl = tyLeManHinh(), net = 3/tl, r = 7/tl;
  g.lineWidth = net;
  g.font = `${Math.round(15/tl)}px system-ui, sans-serif`;
  g.textBaseline = "bottom";

  doan.forEach(d => {
    g.strokeStyle = d.mau; g.fillStyle = d.mau;
    g.beginPath(); g.moveTo(d.a[0], d.a[1]); g.lineTo(d.b[0], d.b[1]); g.stroke();
    for(const p of [d.a, d.b]){ g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI*2); g.fill(); }
    const mx = (d.a[0]+d.b[0])/2, my = (d.a[1]+d.b[1])/2;
    const nhan = `${(Math.hypot(d.b[0]-d.a[0], d.b[1]-d.a[1]) * mmMoiPx()).toFixed(1)} mm`;
    g.lineWidth = net*2.5; g.strokeStyle = "rgba(0,0,0,.65)";
    g.strokeText(nhan, mx + r, my - r);
    g.fillStyle = d.mau; g.fillText(nhan, mx + r, my - r);
    g.lineWidth = net;
  });

  if(diem.length === 1){
    g.fillStyle = MAU[doan.length % MAU.length];
    g.beginPath(); g.arc(diem[0][0], diem[0][1], r, 0, Math.PI*2); g.fill();
  }
  g.setTransform(1,0,0,1,0,0);
}

// ================= KINH LUP =================
function veLup(clientX, clientY, p){
  if(!nan) return;
  const lp = $("#lup"), g = lp.getContext("2d"), R = lp.width, oAnh = 46;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle = "#111"; g.fillRect(0,0,R,R);
  g.imageSmoothingEnabled = false;       // nhin ro tung diem anh
  g.drawImage(nan, p[0]-oAnh/2, p[1]-oAnh/2, oAnh, oAnh, 0, 0, R, R);
  g.strokeStyle = "rgba(255,45,45,.95)"; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(R/2, R/2-15); g.lineTo(R/2, R/2-4);
  g.moveTo(R/2, R/2+4);  g.lineTo(R/2, R/2+15);
  g.moveTo(R/2-15, R/2); g.lineTo(R/2-4, R/2);
  g.moveTo(R/2+4,  R/2); g.lineTo(R/2+15, R/2);
  g.stroke();

  const r = $("#khungAnh").getBoundingClientRect();
  let x = clientX - r.left - R/2;
  let y = clientY - r.top - R - 26;             // dat PHIA TREN ngon tay
  if(y < 4) y = clientY - r.top + 26;
  x = Math.max(4, Math.min(Math.max(4, r.width  - R - 4), x));
  y = Math.max(4, Math.min(Math.max(4, r.height - R - 4), y));
  lp.style.left = x + "px"; lp.style.top = y + "px"; lp.style.display = "block";
}
const anLup = () => { $("#lup").style.display = "none"; };

// ================= CHAM + PHONG TO HAI NGON =================
const c = $("#anh");
const ngon = new Map();
let truoc = null, diChuyen = 0, khoangCu = 0;

function toaDoAnh(ev){
  const r = c.getBoundingClientRect();
  const kx = r.width  ? c.width  / r.width  : 1;
  const ky = r.height ? c.height / r.height : 1;
  const x = (ev.clientX - r.left) * kx;
  const y = (ev.clientY - r.top)  * ky;
  return [ (x - zoom.tx)/zoom.s, (y - zoom.ty)/zoom.s ];
}

function ganBien(){
  const w = c.width*zoom.s, h = c.height*zoom.s;
  zoom.tx = w <= c.width  ? (c.width-w)/2   : Math.min(0, Math.max(c.width-w,  zoom.tx));
  zoom.ty = h <= c.height ? (c.height-h)/2  : Math.min(0, Math.max(c.height-h, zoom.ty));
}

c.addEventListener("pointerdown", e => {
  if(!nan) return;
  ngon.set(e.pointerId, [e.clientX, e.clientY]);
  try{ c.setPointerCapture(e.pointerId); }catch(err){}
  if(ngon.size === 1){
    truoc = [e.clientX, e.clientY]; diChuyen = 0;
    veLup(e.clientX, e.clientY, toaDoAnh(e));
  }else{ truoc = null; diChuyen = 999; anLup(); }
});

c.addEventListener("pointermove", e => {
  if(!nan || !ngon.has(e.pointerId)) return;
  ngon.set(e.pointerId, [e.clientX, e.clientY]);
  const ds = [...ngon.values()];

  if(ds.length >= 2){
    const kc = Math.hypot(ds[0][0]-ds[1][0], ds[0][1]-ds[1][1]);
    if(khoangCu){
      const r = c.getBoundingClientRect(), k = r.width ? c.width / r.width : 1;
      const gx = ((ds[0][0]+ds[1][0])/2 - r.left) * k;
      const gy = ((ds[0][1]+ds[1][1])/2 - r.top)  * k;
      const cu = zoom.s;
      zoom.s = Math.min(8, Math.max(1, zoom.s * (kc / khoangCu)));
      zoom.tx = gx - (gx - zoom.tx) * (zoom.s/cu);
      zoom.ty = gy - (gy - zoom.ty) * (zoom.s/cu);
      ganBien(); ve();
    }
    khoangCu = kc;
  } else if(truoc){
    const dx = e.clientX - truoc[0], dy = e.clientY - truoc[1];
    diChuyen += Math.hypot(dx, dy);
    if(zoom.s > 1 && diChuyen > 10){
      const r = c.getBoundingClientRect(), k = r.width ? c.width / r.width : 1;
      zoom.tx += dx*k; zoom.ty += dy*k;
      ganBien(); ve(); anLup();
    }else veLup(e.clientX, e.clientY, toaDoAnh(e));
    truoc = [e.clientX, e.clientY];
  }
});

function ketThuc(e){
  if(!ngon.has(e.pointerId)) return;
  ngon.delete(e.pointerId);
  if(ngon.size < 2) khoangCu = 0;
  if(ngon.size > 0) return;
  anLup();

  const dangKeo = zoom.s > 1 && diChuyen > 10;
  if(nan && !dangKeo){
    const p = toaDoAnh(e);
    if(p[0] >= 0 && p[1] >= 0 && p[0] <= nan.width && p[1] <= nan.height){
      if(diem.length === 0) diem = [p];
      else { doan.push({ a:diem[0], b:p, mau: MAU[doan.length % MAU.length] }); diem = []; }
    }
    ve();
  }
  truoc = null; diChuyen = 0;
}

c.addEventListener("pointerup", ketThuc);
c.addEventListener("pointercancel", ketThuc);
window.addEventListener("resize", () => { vuaKhung(); ve(); });
</script>
</body>
</html>
